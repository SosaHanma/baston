<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiche perso — Baston de Famille</title>
<style>
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#3a3a38;color:#e8e4da;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  nav{position:fixed;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:#1e1e1c;color:#e8e4da;border:1px solid #5a5a56;border-radius:6px;padding:6px 10px;cursor:pointer}
  nav button.on{background:#e8e4da;color:#1e1e1c}
  .lbl{position:fixed;left:12px;bottom:12px;font:600 13px/1.3 monospace;color:#cfcac0;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav id="nav"></nav>
<div class="lbl" id="lbl"></div>
<script type="module" src="js/fiche.js"></script>
</body>
</html>
